<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Prompt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --ink:#000000; --sub:#777777; --line:#dcdcdc; --ph:#efefef;
  --serif:"Cormorant Garamond","Times New Roman",serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{
  font-family:var(--sans);font-weight:300;color:var(--ink);background:var(--bg);min-height:100vh;
  padding:max(48px,env(safe-area-inset-top,0px)) 24px max(36px,env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;
}
button{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
.wrap{width:100%;max-width:880px;margin:0 auto;flex:1;display:flex;flex-direction:column}
main{flex:1}
.serif{font-family:var(--serif);font-style:italic;font-weight:400}
.ko{font-size:.8rem;color:var(--sub);margin-top:4px}

h1{font-family:var(--serif);font-style:italic;font-weight:400;font-size:2.4rem;line-height:1.1;margin-bottom:72px}

.thumb{aspect-ratio:4/5;background:var(--ph);overflow:hidden;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{font-family:var(--serif);font-style:italic;font-size:3.5rem;color:var(--sub)}
.name{font-family:var(--serif);font-style:italic;font-size:1.55rem;line-height:1.2}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:64px 48px}
.card .open{background:none;border:0;text-align:left;cursor:pointer;width:100%;display:block}
.card .thumb{margin-bottom:18px}
.card .line{font-size:.85rem;margin-top:12px}
.copy{background:none;border:0;border-bottom:1px solid var(--ink);font-size:.78rem;cursor:pointer;padding:0 0 1px;margin-top:14px}

dialog{border:0;background:var(--bg);color:var(--ink);width:min(760px,100% - 24px);max-height:calc(100% - 24px);margin:auto;padding:44px 40px;overflow:auto}
dialog::backdrop{background:rgba(255,255,255,.88)}
dialog .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:36px}
dialog h2{font-family:var(--serif);font-style:italic;font-weight:400;font-size:2.2rem;line-height:1.1}
.x{background:none;border:0;cursor:pointer;font-family:var(--serif);font-style:italic;font-size:1.15rem;color:var(--sub)}
.detail{display:grid;grid-template-columns:200px 1fr;gap:36px}
dl{display:grid;grid-template-columns:80px 1fr;gap:10px 16px;font-size:.88rem;line-height:1.7;align-content:start}
dt{color:var(--sub)} dd{white-space:pre-wrap}
.prompt{margin-top:32px}

footer{margin-top:112px;display:flex;justify-content:space-between;align-items:center;font-family:var(--serif);font-style:italic;font-size:1.1rem}
.mark{width:22px;height:22px;border:2px solid var(--ink);border-radius:50%}

@media (max-width:640px){
  body{padding-left:20px;padding-right:20px}
  h1{margin-bottom:48px}
  .grid{gap:48px 20px}
  .name{font-size:1.25rem}
  dialog{padding:28px 22px}
  .detail{grid-template-columns:1fr}
  .detail .thumb{max-width:200px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title"></h1>
  <main id="view"></main>
  <footer><span id="foot"></span><span class="mark" aria-hidden="true"></span></footer>
</div>
<dialog id="dlg"></dialog>

<script>
/* ==========================================================
   여기만 고치면 돼요. 캐릭터 추가 = 배열에 { } 블록 하나 더 넣기
   image: 저장소에 올린 사진 경로 (예: "img/a.jpg"). 없으면 "" 로 두세요.
   prompt: 화면에는 안 보이고 '프롬 복사' 버튼으로만 복사돼요.
   ========================================================== */
const SITE = { title: "Character Prompt", footer: "Updated 2026.11.15" };

const CHARACTERS = [
  { name: "Character One", ko: "캐릭터 하나", line: "한 줄 소개", image: "",
    info: { "나이": "—", "성격": "성격을 적어주세요", "외형": "외형을 적어주세요", "관계": "—" },
    prompt: "여기에 캐릭터 프롬프트를 붙여 넣으세요." },
  { name: "Character Two", ko: "캐릭터 둘", line: "한 줄 소개", image: "",
    info: { "나이": "—", "성격": "—", "외형": "—" },
    prompt: "" }
];
/* ========================================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dlg = $("#dlg");

document.title = SITE.title;
$("#title").textContent = SITE.title;
$("#foot").textContent = SITE.footer;

const thumb = (img, label) => `<div class="thumb">${img
  ? `<img src="${esc(img)}" alt="${esc(label)}" loading="lazy">`
  : `<span>${esc(label.charAt(0))}</span>`}</div>`;

$("#view").innerHTML = `<div class="grid">${CHARACTERS.map((c,i)=>`
  <div class="card">
    <button class="open" data-c="${i}">${thumb(c.image,c.name)}
      <div class="name">${esc(c.name)}</div><div class="ko">${esc(c.ko)}</div>
      ${c.line?`<div class="line">${esc(c.line)}</div>`:""}</button>
    ${c.prompt?`<button class="copy" data-copy="${i}">프롬 복사</button>`:""}
  </div>`).join("")}</div>`;

function openChar(i){
  const c = CHARACTERS[i];
  dlg.innerHTML = `<div class="top"><div><h2>${esc(c.name)}</h2><div class="ko">${esc(c.ko)}</div></div>
    <button class="x" id="close">close</button></div>
    <div class="detail">${thumb(c.image,c.name)}<dl>${Object.entries(c.info||{}).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl></div>
    ${c.prompt?`<div class="prompt"><button class="copy" data-copy="${i}">프롬 복사</button></div>`:""}`;
  dlg.showModal();
  $("#close").onclick = () => dlg.close();
}

async function copyPrompt(btn){
  const text = CHARACTERS[+btn.dataset.copy].prompt;
  try { await navigator.clipboard.writeText(text); btn.textContent = "복사됨"; }
  catch {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); btn.textContent = "복사됨"; } catch { btn.textContent = "복사 실패"; }
    ta.remove();
  }
  setTimeout(()=>btn.textContent="프롬 복사",1500);
}

$("#view").addEventListener("click", e=>{
  const cb = e.target.closest("[data-copy]"); if (cb) return copyPrompt(cb);
  const c = e.target.closest("[data-c]"); if (c) openChar(+c.dataset.c);
});
dlg.addEventListener("click", e=>{
  const cb = e.target.closest("[data-copy]"); if (cb) return copyPrompt(cb);
  if (e.target===dlg) dlg.close();
});
</script>
</body>
</html>
